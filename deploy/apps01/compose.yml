# Aquatech op de app-VM (apps01, Proxmox). Staat op de server in
# /opt/apps/aquatech/compose.yml; .env, data/ en secrets/ staan alleen daar.
#
# Het image komt uit GHCR (gebouwd en getest door .github/workflows/release.yml).
# Welke versie draait staat in .env (AQUATECH_TAG); update.sh past die aan.
name: aquatech

services:
  aquatech:
    image: ghcr.io/danieldh00/aquatech:${AQUATECH_TAG:?AQUATECH_TAG ontbreekt in .env}
    container_name: aquatech
    restart: unless-stopped
    # Alleen voor beheer via Tailscale; LAN-inbound blokkeert de Proxmox-firewall.
    # Proxykoppen (CF-Connecting-IP, X-Forwarded-For) worden alleen geloofd van TRUSTED_PROXIES (het subnet van dit
    # compose-netwerk, door servertaak 008 in .env gezet), dus niet van een adres buiten dat netwerk. Let op: met de userland-proxy van Docker komt een verbinding naar poort 3300 aan met het gateway-adres van dit netwerk en telt dus als vertrouwd; wie poort 3300 bereikt (Tailscale) kan dus nog steeds een eigen CF-Connecting-IP meegeven.
    ports:
      - "3300:3300"
    environment:
      - PORT=3300
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
      - DATA_DIR=/data
      - TZ=${TZ:-Europe/Amsterdam}
      - AQUATECH_MASTER_KEY_FILE=/run/secrets/master-key
      # Database (PostgreSQL, bijvoorbeeld Supabase of een eigen container), zie DOCS.md > Database: PostgreSQL.
      # PostgreSQL is de enige database: zonder deze regel start de app niet.
      - DATABASE_URL_FILE=/run/secrets/database-url
      # Updaten vanuit de app (Beheer > Systeem > Updates), zie update.sh: de status alleen-lezen,
      # alleen de aanvraagmap is schrijfbaar (uid 1000). Aanmaken met setup-app-update.sh.
      - UPDATE_STATUS_DIR=/update/status
      - UPDATE_REQUEST_DIR=/update/request
    volumes:
      - ./data:/data
      - ./update/status:/update/status:ro
      - ./update/request:/update/request
    secrets:
      - master-key
      - database-url
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3300/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  cloudflared:
    image: cloudflare/cloudflared:2026.9.3@sha256:072c067d25ccbe61d46e18f0d0723255f2bb5304f7317caa95b27031520ff92c
    container_name: aquatech-cloudflared
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      aquatech:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

secrets:
  master-key:
    file: ./secrets/master-key
  database-url:
    file: ./secrets/database-url
