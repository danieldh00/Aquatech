# Stagingomgeving van Aquatech Hub op apps01: een tweede opstelling naast de testomgeving, die develop volgt.
# Staat op de server in /opt/apps/aquatech-staging (repo/deploy/staging/compose.yml); beheerd door install-staging.sh,
# nooit met de hand. Zie docs/STAGING.md.
#
# Gescheiden van de testomgeving: eigen projectnaam (aquatech-staging), eigen image (lokaal gebouwd, nooit uit een registry),
# eigen database-container, eigen mappen en geheimen. Gedeeld zijn alleen de server en het netwerk van de bestaande tunnel
# (de app krijgt daar de alias aquatech-staging). Geen koppelingen: geen mail, geen back-up naar buiten, geen betalingen.
name: aquatech-staging

services:
  # De servicenaam is ook een netwerkalias in elk netwerk waar de service in zit, dus in het gedeelde tunnelnetwerk. Daarom
  # nooit `aquatech` of `postgres` (die namen zijn van de testomgeving): alle servicenamen beginnen met aquatech-staging.
  aquatech-staging-app:
    image: aquatech-staging:${STAGING_COMMIT:?STAGING_COMMIT ontbreekt in .env}
    pull_policy: never
    build:
      context: ./repo/hub
      args:
        VUE_MODULES: ${VUE_MODULES:-}
      labels:
        nl.aquatech.staging: "1"
    labels:
      nl.aquatech.staging: "1"
    container_name: aquatech-staging
    restart: unless-stopped
    # Alleen lokaal bereikbaar (voor de controle op de server zelf); de bezoeker komt via de tunnel naar de alias.
    ports:
      - "127.0.0.1:${STAGING_PORT:-3310}:3300"
    environment:
      - PORT=3300
      - TZ=${TZ:-Europe/Amsterdam}
      - DATA_DIR=/data
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
      - AQUATECH_MASTER_KEY_FILE=/run/secrets/master-key
      - DATABASE_URL_FILE=/run/secrets/database-url
      - SETUP_CODE=${SETUP_CODE:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Stagingmodus: noindex en een stagingbalk (server.js, shared/common.js). Migraties zijn alleen toevoegingen, dus een
      # terugval naar de vorige commit mag een nieuwere database zien.
      - AQUATECH_STAGING=1
      - AQUATECH_ALLOW_NEWER_SCHEMA=1
    volumes:
      - ./data:/data
    secrets:
      - master-key
      - database-url
    depends_on:
      aquatech-staging-db:
        condition: service_healthy
    networks:
      default: {}
      tunnel:
        aliases:
          - aquatech-staging
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3300/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  aquatech-staging-db:
    # Derde partij: vaste digest (Renovate werkt hem bij). Eigen container en eigen map; niets gedeeld met de testomgeving.
    image: postgres:17@sha256:87c8b42f423b45d5247e6aa8fdb2e7762fec164c68a50fe3eb07e7bfcaf4dbcf
    container_name: aquatech-staging-postgres
    restart: unless-stopped
    shm_size: 128mb
    stop_grace_period: 60s
    environment:
      - POSTGRES_DB=aquatech
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres-password
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --auth-host=scram-sha-256 --data-checksums
      - TZ=${TZ:-Europe/Amsterdam}
    command:
      - postgres
      - -c
      - max_connections=40
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=8MB
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    secrets:
      - postgres-password
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aquatech"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6

networks:
  # Het netwerk van de bestaande tunnelcontainer (naam staat in .env; install-staging.sh leest hem alleen-lezen uit).
  tunnel:
    name: ${TUNNEL_NETWORK:?TUNNEL_NETWORK ontbreekt in .env}
    external: true

secrets:
  master-key:
    file: ./secrets/master-key
  database-url:
    file: ./secrets/database-url
  postgres-password:
    file: ./secrets/postgres-password
