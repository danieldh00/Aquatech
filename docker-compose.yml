# Los draaien buiten Home Assistant (bijv. op een eigen server):
# `ACCESS_CODE=... docker compose up -d` -> http://<server>:3300
services:
  beregeningsplanner:
    build: ./beregeningsplanner
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3300}:3300"
    environment:
      - PORT=3300
      - DATA_DIR=/data
      - ACCESS_CODE=${ACCESS_CODE:-}
    volumes:
      - beregeningsplanner-data:/data

volumes:
  beregeningsplanner-data:
