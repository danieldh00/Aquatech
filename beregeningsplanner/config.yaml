# TIJDELIJK: alleen nog zodat de bestaande Home Assistant-installatie updates
# blijft krijgen tot de losse Docker-server draait (zie docker-compose.yml in
# de root). De app zelf gebruikt niets van Home Assistant meer: geen ingress,
# geen paneel, geen app-opties. Na de overstap mogen config.yaml,
# apparmor.txt, icon.png, logo.png en ../repository.yaml weg.
name: "Aquatech"
version: "0.19.1"
slug: beregeningsplanner
description: >-
  Aquatech-dashboard met modules (beregeningsplanner, beheer). Draait als
  gewone webserver op poort 3300; inloggen met een eigen account.
url: "https://github.com/danieldh00/Aquatech"
arch:
  - aarch64
  - amd64
startup: application
boot: auto
ports:
  3300/tcp: 3300
ports_description:
  3300/tcp: "Webinterface (Cloudflare-tunnel aquatech.den-hollander.com)"
webui: "http://[HOST]:[PORT:3300]/"
environment:
  DATA_DIR: /data
options: {}
schema: {}
