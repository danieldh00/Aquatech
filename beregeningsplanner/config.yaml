name: "Aquatech"
version: "0.11.0"
slug: beregeningsplanner
description: >-
  Aquatech-dashboard met modules. Eerste module, de beregeningsplanner:
  ontwerp een automatische tuinberegening: gebieden tekenen, sproeiers
  automatisch plaatsen met neerslagsimulatie, zones en leidingen met
  drukverlies, en een stuklijst (Basis/Standaard/Premium) met export naar Excel.
url: "https://github.com/danieldh00/Aquatech"
arch:
  - aarch64
  - amd64
startup: application
boot: auto
ports:
  3300/tcp: 3300
ports_description:
  3300/tcp: "Webinterface (los van ingress, nodig voor de Cloudflare-tunnel aquatech.den-hollander.com)"
# De gepubliceerde poort blijft naast ingress staan: de tunnel bereikt de app
# via de poort, ingress (HA-zijpaneel) via het wisselende ingress-pad.
webui: "http://[HOST]:[PORT:3300]/"
ingress: true
ingress_port: 3300
panel_icon: mdi:view-dashboard-outline
panel_title: Aquatech
environment:
  DATA_DIR: /data
# Leeg laten: een `null`-waarde hier maakt de optie voor Supervisor verplicht
# en dan start de app niet zonder code.
options: {}
schema:
  # Optioneel. Leeg = planner openbaar via de tunnel. Ingevuld = inloggen
  # verplicht buiten Home Assistant om; via het HA-zijpaneel nooit een code.
  access_code: "password?"
  # API-sleutel van Anthropic (console.anthropic.com) voor "Plan laden en
  # concept maken". Leeg = automatisch herkennen uit; tekenen werkt altijd.
  anthropic_api_key: "password?"
  # Maximaal aantal plananalyses per dag voor de hele app (kostenbewaking,
  # de publieke URL is zonder toegangscode voor iedereen bereikbaar).
  ai_daily_limit: "int(0,500)?"
