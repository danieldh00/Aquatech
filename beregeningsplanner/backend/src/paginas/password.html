    <p id="intro">Kies een nieuw wachtwoord van minimaal 12 tekens. Je wordt daarna op je andere toestellen uitgelogd.</p>
    <input type="text" name="username" autocomplete="username" id="user" hidden>
    <label for="cur">Huidig wachtwoord</label>
    <input id="cur" type="password" autocomplete="current-password" required autofocus>
    <label for="new1" style="margin-top:12px">Nieuw wachtwoord</label>
    <input id="new1" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
    <label for="new2" style="margin-top:12px">Nieuw wachtwoord herhalen</label>
    <input id="new2" type="password" autocomplete="new-password" maxlength="128" required>
    <button id="b" type="submit">Wachtwoord opslaan</button>
    <div class="err" id="e" role="alert"></div>
    <a class="alt" id="back" href="./">Annuleren</a>
  </form>
  <script>
    // Relatief tot de root van de app (de pagina kan op elk pad staan).
    const base = location.pathname.replace(/[^/]*$/, '').split('/').filter(Boolean).map(() => '..').join('/');
    const api = (p) => (base ? base + '/' : '') + 'api/' + p;
    const home = base ? base + '/' : './';
    const back = document.getElementById('back');
    let forced = false;
    back.href = home;
    // Verplicht wijzigen (na een nieuw account of een reset): geen annuleren, wel uitloggen.
    fetch(api('me'), { cache: 'no-store' }).then((r) => r.json()).then((me) => {
      if (!me.user || me.user.kind !== 'account' || me.impersonation) {
        document.getElementById('e').textContent = me.impersonation ? 'Ga eerst terug naar je eigen account.' : 'Log in met je eigen account om je wachtwoord te wijzigen.';
        document.getElementById('b').disabled = true;
        return;
      }
      document.getElementById('user').value = me.user.username;
      forced = Boolean(me.user.mustChangePassword);
      if (!forced) return;
      document.getElementById('intro').textContent = 'Welkom, ' + me.user.displayName + '. Kies eerst een eigen wachtwoord van minimaal 12 tekens; het wachtwoord dat je hebt gekregen werkt daarna niet meer.';
      back.textContent = 'Uitloggen';
      back.onclick = async (ev) => {
        ev.preventDefault();
        try { await fetch(api('auth/logout'), { method: 'POST' }); } catch (_) { /* negeren */ }
        location.href = home;
      };
    }).catch(() => {});
    document.getElementById('f').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const b = document.getElementById('b'), e = document.getElementById('e');
      const cur = document.getElementById('cur').value, n1 = document.getElementById('new1').value, n2 = document.getElementById('new2').value;
      e.textContent = '';
      if (!cur) { e.textContent = 'Vul je huidige wachtwoord in.'; return; }
      if (n1.length < 12) { e.textContent = 'Het nieuwe wachtwoord moet minimaal 12 tekens hebben.'; return; }
      if (n1 !== n2) { e.textContent = 'De twee nieuwe wachtwoorden zijn niet gelijk.'; return; }
      b.disabled = true;
      try {
        const res = await fetch(api('account/password'), {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ currentPassword: cur, newPassword: n1 }),
        });
        if (res.ok) {
          // Verplicht: de gevraagde pagina opnieuw laden; anders terug naar het dashboard.
          if (/\/wachtwoord$/.test(location.pathname)) location.href = home; else location.reload();
          return;
        }
        const body = await res.json().catch(() => ({}));
        e.textContent = body.message || 'Opslaan mislukt.';
      } catch (err) {
        e.textContent = 'Geen verbinding met de server.';
      }
      b.disabled = false;
    });
  </script>
</body>
</html>
