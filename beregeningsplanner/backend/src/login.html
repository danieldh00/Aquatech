<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Inloggen – Aquatech</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
      font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f4f6f8; color: #1f2a33; }
    .card { width: 100%; max-width: 360px; background: #fff; border-radius: 12px; padding: 28px 24px; box-shadow: 0 4px 20px rgba(0,0,0,.08); }
    h1 { font-size: 18px; margin: 0 0 4px; color: #01579b; display: flex; gap: 8px; align-items: center; }
    p { color: #6b7a86; margin: 0 0 18px; font-size: 14px; }
    label { display: block; font-size: 13px; color: #6b7a86; margin-bottom: 6px; }
    input { width: 100%; padding: 10px 12px; font: inherit; border: 1px solid #dde3e8; border-radius: 6px; }
    button { width: 100%; margin-top: 14px; padding: 10px; font: inherit; font-weight: 600; color: #fff; background: #0277bd; border: 0; border-radius: 6px; cursor: pointer; }
    button:disabled { opacity: .6; }
    .err { color: #c62828; font-size: 14px; min-height: 20px; margin-top: 10px; }
  </style>
</head>
<body>
  <form class="card" id="f">
    <h1><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2c-3.5 5-7 8.6-7 12.3A7 7 0 0 0 12 21a7 7 0 0 0 7-6.7C19 10.6 15.5 7 12 2Z"/></svg>Aquatech</h1>
    <p>Log in met je gebruikersnaam en wachtwoord, of laat de gebruikersnaam leeg en vul de toegangscode in. Dit toestel onthoudt de inlog een jaar.</p>
    <label for="user">Gebruikersnaam</label>
    <input id="user" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" autofocus>
    <label for="code" style="margin-top:12px">Wachtwoord of toegangscode</label>
    <input id="code" name="code" type="password" autocomplete="current-password" required>
    <button id="b" type="submit">Inloggen</button>
    <div class="err" id="e" role="alert"></div>
  </form>
  <script>
    document.getElementById('f').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const b = document.getElementById('b'), e = document.getElementById('e');
      b.disabled = true; e.textContent = '';
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: document.getElementById('user').value.trim(), password: document.getElementById('code').value, code: document.getElementById('code').value }),
        });
        // Op /login naar het dashboard, anders dezelfde pagina opnieuw laden.
        if (res.ok) { if (/\/login$/.test(location.pathname)) location.href = './'; else location.reload(); return; }
        const body = await res.json().catch(() => ({}));
        e.textContent = body.message || 'Inloggen mislukt.';
      } catch (err) {
        e.textContent = 'Geen verbinding met de server.';
      }
      b.disabled = false;
    });
  </script>
</body>
</html>
