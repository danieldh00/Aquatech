<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#172f5e">
  <meta name="robots" content="noindex">
  <title>Meldingen – AquaTech Service</title>
  <link rel="stylesheet" href="../shared/brand.css">
  <link rel="stylesheet" href="../shared/theme.css">
  <link rel="stylesheet" href="../shared/sidebar.css">
  <link rel="stylesheet" href="../dashboard/dashboard.css">
  <link rel="stylesheet" href="../beheer/beheer.css">
  <link rel="stylesheet" href="../werkorders/photos.css">
  <link rel="stylesheet" href="meldingen.css">
  <script src="../shared/common.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand home" href="../" title="Terug naar het overzicht">
      <img class="brand-logo" src="../shared/logo-white.png" alt="AquaTech Service">
      <span class="brand-sep" aria-hidden="true"></span>
      <span class="brand-name">Meldingen</span>
    </a>
    <span id="account" class="account"></span>
  </header>

  <main class="dash wide">
    <section class="intro">
      <h1>Meldingen</h1>
      <p class="muted">Storingen en onderhoudsverzoeken die klanten via hun portaal hebben gemeld, met hun foto's. Stuur de klant een reactie of maak er direct een werkorder van; de klant ziet die werkorder en de afspraak dan in zijn portaal.</p>
    </section>
    <div id="m-denied" class="notice" hidden></div>

    <div id="m-app" hidden>
      <div class="filters">
        <label class="chk"><input type="checkbox" id="m-all"> Ook afgehandelde, afgewezen en ingetrokken meldingen</label>
      </div>
      <div class="tablewrap"><table class="grid" id="m-table"></table></div>
      <p id="m-empty" class="muted" hidden>Er zijn geen lopende meldingen.</p>
    </div>
  </main>

  <div id="detail" class="modal" hidden>
    <div class="modal-card wide">
      <button class="btn ghost close" id="detail-close" title="Sluiten">✕</button>
      <div id="detail-body"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="../shared/env.js"></script>
  <script src="../dashboard/modules.js"></script>
  <script src="../shared/sidebar.js"></script>
  <script src="../dashboard/account.js"></script>
  <script src="../werkorders/photos.js"></script>
  <script src="meldingen.js"></script>
</body>
</html>
