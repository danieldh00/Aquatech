<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#172f5e">
  <meta name="robots" content="noindex">
  <title>Plannenoverzicht – AquaTech Service</title>
  <link rel="stylesheet" href="../shared/brand.css">
  <link rel="stylesheet" href="../shared/theme.css">
  <link rel="stylesheet" href="../shared/sidebar.css">
  <link rel="stylesheet" href="../dashboard/dashboard.css">
  <link rel="stylesheet" href="../beheer/beheer.css">
  <link rel="stylesheet" href="plannen.css">
  <script src="../shared/common.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand home" href="../" title="Terug naar het overzicht">
      <img class="brand-logo" src="../shared/logo-white.png" alt="AquaTech Service">
      <span class="brand-sep" aria-hidden="true"></span>
      <span class="brand-name">Plannenoverzicht</span>
    </a>
    <span id="account" class="account"></span>
  </header>

  <main class="dash wide">
    <section class="intro">
      <h1 id="p-heading">Plannen</h1>
      <p id="p-intro" class="muted"></p>
    </section>

    <div id="stats" class="stats" hidden></div>

    <div class="filters">
      <input id="f-search" type="search" placeholder="Zoek op projectnaam, klant of adres">
      <select id="f-owner" hidden><option value="">Alle gebruikers</option></select>
      <select id="f-review" aria-label="Status"><option value="">Alle statussen</option><option value="ter_controle">Ter controle</option><option value="concept">Concept</option><option value="goedgekeurd">Goedgekeurd</option></select>
      <label class="chk" id="f-deleted-wrap" hidden><input type="checkbox" id="f-deleted"> Ook verwijderde plannen</label>
      <a class="btn" href="../beregening/">Nieuw plan</a>
      <button id="f-export" class="btn primary">Exporteer naar Excel</button>
    </div>

    <div class="tablewrap"><table class="grid sortable" id="p-table"></table></div>
    <p id="p-count" class="muted small"></p>
  </main>

  <div id="detail" class="modal" hidden>
    <div class="modal-card">
      <button class="btn ghost close" id="detail-close" title="Sluiten">✕</button>
      <div id="detail-body"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="../shared/env.js"></script>
  <script src="../dashboard/modules.js"></script>
  <script src="../shared/sidebar.js"></script>
  <script src="../beregening/js/sprinklerlib.js"></script>
  <script src="../beregening/js/catalog.js"></script>
  <script src="../dashboard/account.js"></script>
  <script src="plannen.js"></script>
</body>
</html>
