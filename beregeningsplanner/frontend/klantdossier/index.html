<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#172f5e">
  <meta name="robots" content="noindex">
  <title>Klantdossiers – AquaTech Service</title>
  <link rel="stylesheet" href="../shared/brand.css">
  <link rel="stylesheet" href="../shared/sidebar.css">
  <link rel="stylesheet" href="../dashboard/dashboard.css">
  <link rel="stylesheet" href="../beheer/beheer.css">
  <link rel="stylesheet" href="../plannen/plannen.css">
  <link rel="stylesheet" href="../werkorders/werkorders.css">
  <link rel="stylesheet" href="../werkorders/photos.css">
  <link rel="stylesheet" href="klantdossier.css">
</head>
<body>
  <header class="topbar">
    <a class="brand home" href="../" title="Terug naar het overzicht">
      <img class="brand-logo" src="../shared/logo-white.png" alt="AquaTech Service">
      <span class="brand-sep" aria-hidden="true"></span>
      <span class="brand-name">Klantdossiers</span>
    </a>
    <span id="account" class="account"></span>
  </header>

  <!-- Overzicht -->
  <main id="list-view" class="dash wide">
    <section class="intro">
      <h1>Klantdossiers</h1>
      <p class="muted">Per klant alle installaties: wanneer en door wie opgeleverd, het ontwerp en de zones, de geplaatste materialen en de foto's van voor, tijdens en na de aanleg. Druk een dossier af als opleverrapport of sla het op als PDF.</p>
    </section>
    <div id="l-stats" class="stats" hidden></div>
    <div class="filters">
      <input id="l-search" type="search" placeholder="Zoek op klant of adres">
      <label class="chk"><input type="checkbox" id="l-done"> Alleen met opgeleverde installatie</label>
      <button id="l-export" class="btn">Exporteer naar Excel</button>
    </div>
    <div class="tablewrap"><table class="grid sortable" id="l-table"></table></div>
    <p id="l-count" class="muted small"></p>
  </main>

  <!-- Eén dossier -->
  <main id="detail-view" class="dash wide dossier" hidden>
    <div class="edit-bar no-print">
      <button id="d-back" class="btn">← Overzicht</button>
      <span class="spacer"></span>
      <label class="chk"><input type="checkbox" id="d-internal" checked> Ook interne foto's</label>
      <button id="d-print" class="btn primary">Opleverrapport / PDF</button>
    </div>
    <div id="d-body"></div>
  </main>

  <div id="toast" class="toast no-print"></div>

  <script src="../shared/env.js"></script>
  <script src="../dashboard/modules.js"></script>
  <script src="../shared/sidebar.js"></script>
  <script src="../beregening/vendor/exceljs.min.js"></script>
  <script src="../dashboard/account.js"></script>
  <script src="../werkorders/workorder-core.js"></script>
  <script src="../werkorders/photos.js"></script>
  <script src="klantdossier.js"></script>
</body>
</html>
