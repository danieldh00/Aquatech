name: CodeRabbit-aanvraag

# CodeRabbit reviewt deze repository niet automatisch (minder dan 10 sterren: "Trigger review" moet handmatig).
# Deze workflow vraagt daarom bij elke nieuwe PR naar master één keer een review met `@coderabbitai review`.
# Alleen bij openen (niet bij elke push): CodeRabbit heeft een limiet van ongeveer één review per uur, en een
# volgende push beoordeelt de Claude-review al. Een review die toch wordt gemist (limiet) vangt de inhaalreview
# (coderabbit-catchup.yml) na het mergen op. Een PR van een bot krijgt geen review (geen seat), dus die slaan we over.

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
    branches: [master]

permissions:
  pull-requests: write

jobs:
  request:
    if: github.event.pull_request.draft == false && github.event.pull_request.user.type == 'User' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- coderabbit-review-request -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            if (comments.some((comment) => String(comment.body).includes(marker))) {
              core.info('Review is al gevraagd.');
              return;
            }
            await github.rest.issues.createComment({ owner, repo, issue_number, body: `@coderabbitai review\n\n${marker}` });
            core.notice(`CodeRabbit-review gevraagd op PR #${issue_number}`);
