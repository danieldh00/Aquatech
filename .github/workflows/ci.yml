name: CI

# Zuinig draaien: een branch met een pull request draait alleen via de PR (geen dubbele run op push), een nieuwe push
# annuleert de lopende run, en een PR die geen code raakt (alleen docs, changes/, tests-zonder-code) slaat de zware
# jobs over. Een overgeslagen job (`if`) telt voor de verplichte checks als geslaagd; een `paths:`-filter op
# workflowniveau zou de checks laten hangen en wordt daarom niet gebruikt.
on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Bepaalt of de PR code raakt. Op master (push) en bij een mislukte vergelijking draait alles.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - name: Raakt deze wijziging code?
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$NUMBER" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api "repos/$REPO/pulls/$NUMBER/files" --paginate --jq '.[].filename') || { echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; }
          echo "$files"
          if echo "$files" | grep -Eq '^(hub/|deploy/|docker-compose\.yml|\.github/workflows/(ci|release)\.yml)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Geen code gewijzigd (alleen docs of changes/): tests en image-build overgeslagen."
          fi

  # Alleen de afhankelijkhedencontrole: de tests zelf draaien in test-postgres (PostgreSQL is de enige database). De naam
  # `test` blijft bestaan omdat hij een verplichte controle op master is.
  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: hub/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: hub/backend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

  # De testsuite tegen PostgreSQL (de enige database), inclusief de tests van het schema en de back-ups.
  test-postgres:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: hub/backend
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: hub/backend/package-lock.json
      - run: npm ci
      - run: npm test

  # Bouwt de image voor beide architecturen (amd64 = gewone server/VPS,
  # arm64 = Raspberry Pi e.d.) en start de container om te zien dat hij antwoordt.
  docker:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Image bouwen (${{ matrix.platform }})
        # Laaglaag-cache per platform (zoals release.yml): npm ci wordt alleen opnieuw gedaan als package*.json wijzigt.
        run: >-
          docker buildx build --platform ${{ matrix.platform }} --load -t hub:test
          --cache-from type=gha,scope=ci-${{ matrix.platform }}
          --cache-to type=gha,mode=max,scope=ci-${{ matrix.platform }}
          hub
      - name: Smoketest
        run: |
          docker network create smokenet
          docker run -d --name smokedb --network smokenet -e POSTGRES_PASSWORD=smoke postgres:17
          for i in $(seq 1 30); do docker exec smokedb pg_isready -U postgres && break; sleep 2; done
          docker run -d --name hl --network smokenet --platform ${{ matrix.platform }} -p 3300:3300 -e DATABASE_URL="postgres://postgres:smoke@smokedb:5432/postgres?sslmode=disable" -e ACCESS_CODE=ci hub:test
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3300/api/health && exit 0; sleep 2; done
          docker logs hl
          exit 1
      - name: Smoketest eerste start (instelscherm voor de eerste beheerder)
        run: |
          docker run -d --name solo --network smokenet --platform ${{ matrix.platform }} -p 3301:3300 -e DATABASE_URL="postgres://postgres:smoke@smokedb:5432/postgres?sslmode=disable" -e DATABASE_SCHEMA=eerste_start hub:test
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3301/api/health && break; sleep 2; done
          docker logs solo
          docker logs solo 2>&1 | grep -q 'eerste beheerdersaccount'
          curl -s http://127.0.0.1:3301/app/ | grep -q 'Beheerder aanmaken'
          docker stop -t 10 solo
