name: Versie

# Een PR verhoogt het versienummer niet zelf en past CHANGELOG.md en releases.js niet aan: dat doet
# release.yml na het mergen vanuit het bestand changes/<naam>.md. Deze controle bewaakt dat.
# De naam van de job (version-must-increase) staat als verplichte controle in de rulesets van master en develop;
# wijzig hem alleen samen met die ruleset.

on:
  pull_request:
    branches: [master, develop]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  version-must-increase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Releasenotes en versie controleren
        env:
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: node hub/backend/tools/release-notes.js --pull-request "origin/${{ github.base_ref }}"
