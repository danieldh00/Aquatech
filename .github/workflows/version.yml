name: Versie

# Een PR verhoogt het versienummer niet zelf en past CHANGELOG.md en releases.js niet aan: dat doet
# release.yml na het mergen vanuit het bestand changes/<naam>.md. Deze controle bewaakt dat.
# De naam van de job (version-must-increase) staat als verplichte controle in de ruleset van master;
# wijzig hem alleen samen met die ruleset.

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  version-must-increase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Releasenotes en versie controleren
        env:
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: node hub/backend/tools/release-notes.js --pull-request "origin/${{ github.base_ref }}"
