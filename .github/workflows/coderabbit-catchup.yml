name: CodeRabbit-inhaalreview

# Er mag geen merge ongereviewd blijven. CodeRabbit kan een PR missen (uurlimiet, repo met weinig sterren:
# automatische reviews staan uit). Elke 6 uur kijkt deze workflow welke gemergde PR's geen CodeRabbit-review
# op hun laatste commit hebben, labelt ze `coderabbit-pending` en opent een PR van `coderabbit/catchup` naar de
# branch `coderabbit-baseline` met de cumulatieve diff (nooit mergen, de versiecheck draait er niet op omdat
# master niet het doel is). Na de review gaan de bevindingen de issueroute in en schuift de baseline op.
# Logica en tests: beregeningsplanner/backend/tools/coderabbit-catchup.js.
# Vereist: Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests".
# CodeRabbit slaat een PR van een bot over (geen seat). Daarom maakt deze workflow de inhaal-PR aan met het
# geheim CODERABBIT_PR_TOKEN (fijnmazige token van Daniël: Contents + Pull requests + Issues schrijven) zodat de
# PR onder zijn naam staat; zonder dat geheim valt hij terug op GITHUB_TOKEN en krijgt de PR geen review.

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
  # Rondt de inhaalreview af zodra CodeRabbit klaar is.
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  issues: write
  pull-requests: write

# Eén run tegelijk.
concurrency:
  group: coderabbit-catchup
  cancel-in-progress: false

jobs:
  catchup:
    if: github.event_name != 'pull_request_review' || (github.event.pull_request.head.ref == 'coderabbit/catchup' && github.event.pull_request.head.repo.full_name == github.repository && github.event.review.user.login == 'coderabbitai[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Altijd de code van de default branch: het token mag nooit code uit een PR-branch uitvoeren.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.CODERABBIT_PR_TOKEN || github.token }}
          script: |
            const findings = require('./beregeningsplanner/backend/tools/coderabbit-findings.js');
            const catchup = require('./beregeningsplanner/backend/tools/coderabbit-catchup.js');
            const { owner, repo } = context.repo;
            const result = await catchup.tick(catchup.createClient(github, owner, repo), {
              processPullRequest: findings.processPullRequest,
              findingsClient: findings.createClient(github, owner, repo),
            });
            core.notice(result);
