name: Claude-review

# Eerste, verplichte controle op elke pull request naar master: een code review en een securityreview door Claude.
# De jobnamen "Claude code review" en "Claude security review" zijn de required status checks in de ruleset.
# Vereist het repository-secret ANTHROPIC_API_KEY (zonder dat falen de jobs met een duidelijke melding, zodat een
# required check nooit stilletjes slaagt zonder review). Bevindingen komen als opmerkingen op de PR; de bouwthread
# lost ze op of antwoordt met een reden.
#
# Kosten zo laag mogelijk (elke run is betaald):
# - De stap "Wat is gewijzigd" kijkt welke bestanden de PR (bij een push: alleen die push) raakt. Raakt dat geen
#   code (alleen docs, tests, afbeeldingen) dan slaagt de job zonder review; de securityreview draait alleen bij
#   wijzigingen in backend/src, frontend, deploy of de Docker-bestanden.
# - Model per soort run via repository-variabelen (staan bewust niet in de code): CLAUDE_REVIEW_MODEL voor de
#   eerste, volledige review (PR geopend of klaar voor review) en CLAUDE_REVIEW_MODEL_PUSH voor de lichtere review
#   van een volgende push. Leeg = standaardmodel van de action (duurder).
# - De review van een push beoordeelt alleen wat sinds de vorige review is gewijzigd; --max-turns begrenst de lus;
#   een nieuwe push annuleert een lopende run; concept-PR's worden overgeslagen.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [master]

# Een nieuwe push vervangt de lopende review.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  code-review:
    name: Claude code review
    # Pull requests uit forks krijgen geen secrets; die worden niet gebruikt in dit project.
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Controleer of de API-sleutel is ingesteld
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Repository-secret ANTHROPIC_API_KEY ontbreekt (Settings > Secrets and variables > Actions). Zonder sleutel is er geen Claude-review."
            exit 1
          fi
      - name: Wat is gewijzigd
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          MODEL_FULL: ${{ vars.CLAUDE_REVIEW_MODEL }}
          MODEL_PUSH: ${{ vars.CLAUDE_REVIEW_MODEL_PUSH }}
        run: |
          if [ "$ACTION" = "synchronize" ]; then
            files=$(gh api "repos/$REPO/compare/$BEFORE...$AFTER" --paginate --jq '.files[].filename' || gh api "repos/$REPO/pulls/$NUMBER/files" --paginate --jq '.[].filename')
            model="$MODEL_PUSH"
          else
            files=$(gh api "repos/$REPO/pulls/$NUMBER/files" --paginate --jq '.[].filename')
            model="$MODEL_FULL"
          fi
          echo "$files"
          if echo "$files" | grep -Eq '^(beregeningsplanner/(backend/(src|tools|package)|frontend/)|deploy/|scripts/|docker-compose\.yml|beregeningsplanner/Dockerfile)'; then
            echo "review=true" >> "$GITHUB_OUTPUT"
          else
            echo "review=false" >> "$GITHUB_OUTPUT"
            echo "Geen code gewijzigd: review overgeslagen."
          fi
          echo "model=$model" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.scope.outputs.review == 'true'
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        if: steps.scope.outputs.review == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: false
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            EVENT: ${{ github.event.action }}

            Doe een code review van deze pull request. Lees eerst CLAUDE.md in de root: daar staan de
            projectregels (checklist voor elke nieuwe feature, codestijl, harde regels). Controleer vooral:
            - juistheid en randgevallen (ook gelijktijdigheid), werkt de SQL in SQLite én PostgreSQL, migratie in
              MIGRATIONS én PG_MIGRATIONS;
            - tenant-isolatie, rechten (requireRight), rate limits, geheimen, invoer saneren, uploads;
            - queries: geen SELECT *, geen N+1, indexen met tenant_id vooraan, geen zware queries op een warme pad;
            - frontend: relatieve URL's, geen CDN's, --at-*-kleurvariabelen, getJson voor api/me en api/config;
            - tests: nieuwe routes hebben een test voor andere tenant (404) en ontbrekend recht (403);
            - versie-bump, CHANGELOG.md en een regel bovenaan releases.js als beregeningsplanner/ is gewijzigd;
            - codestijl: duidelijke namen en een commentaarblok per functie in het Nederlands.
            De software is nog in ontwikkeling: meld geen problemen met gegevens van vóór een migratie.

            Is EVENT `synchronize`, dan is dit een volgende push op een PR die al is gereviewd: lees met
            `gh pr view --comments` je eerdere opmerkingen, beoordeel alleen de commits sinds die review
            (`gh pr view --json commits`) en herhaal niets wat al is gemeld.

            Gebruik `gh pr diff` en `gh pr view` om de wijzigingen te lezen en lees alleen de omliggende code die nodig is.
            Plaats concrete bevindingen als inline opmerkingen op de regel (mcp__github_inline_comment__create_inline_comment,
            met confirmed: true) en eindig met één korte samenvattende opmerking (`gh pr comment`) met het oordeel.
            Wees specifiek en geef per bevinding het gevolg en een voorstel voor de oplossing. Geen opmerkingen over
            smaak of dingen die goed zijn. Schrijf in het Nederlands.
          claude_args: >-
            ${{ steps.scope.outputs.model && format('--model {0}', steps.scope.outputs.model) || '' }}
            --max-turns 15
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"

  security-review:
    name: Claude security review
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Controleer of de API-sleutel is ingesteld
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Repository-secret ANTHROPIC_API_KEY ontbreekt (Settings > Secrets and variables > Actions). Zonder sleutel is er geen securityreview."
            exit 1
          fi
      - name: Wat is gewijzigd
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          MODEL_FULL: ${{ vars.CLAUDE_REVIEW_MODEL }}
          MODEL_PUSH: ${{ vars.CLAUDE_REVIEW_MODEL_PUSH }}
        run: |
          if [ "$ACTION" = "synchronize" ]; then
            files=$(gh api "repos/$REPO/compare/$BEFORE...$AFTER" --paginate --jq '.files[].filename' || gh api "repos/$REPO/pulls/$NUMBER/files" --paginate --jq '.[].filename')
            model="$MODEL_PUSH"
          else
            files=$(gh api "repos/$REPO/pulls/$NUMBER/files" --paginate --jq '.[].filename')
            model="$MODEL_FULL"
          fi
          echo "$files"
          relevant=$(echo "$files" | grep -Ev '^beregeningsplanner/frontend/(vendor/|.*\.(png|jpe?g|webp|svg|woff2?)$)' | grep -E '^(beregeningsplanner/(backend/src/|frontend/)|deploy/|docker-compose\.yml|beregeningsplanner/Dockerfile)' || true)
          if [ -n "$relevant" ]; then
            echo "review=true" >> "$GITHUB_OUTPUT"
          else
            echo "review=false" >> "$GITHUB_OUTPUT"
            echo "Geen beveiligingsrelevante code gewijzigd: securityreview overgeslagen."
          fi
          echo "model=$model" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.scope.outputs.review == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      # Twee stappen omdat een lege claude-model de standaard van de action overschrijft.
      - uses: anthropics/claude-code-security-review@main
        if: steps.scope.outputs.review == 'true' && steps.scope.outputs.model != ''
        with:
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude-model: ${{ steps.scope.outputs.model }}
          comment-pr: true
          exclude-directories: "beregeningsplanner/frontend/vendor,beregeningsplanner/backend/test/fixtures"
          custom-security-scan-instructions: |
            Dit is een multitenant webapp (Node/Express, SQLite en PostgreSQL met RLS). Let extra op: ontbrekend
            tenant_id-filter in queries, ontbrekende requireRight op routes, IDOR via id's uit de URL, SSRF bij
            uitgaande verbindingen (netguard.publicAddress), SQL die tekst plakt in plaats van ?-parameters,
            geheimen in logs, audit-detail of frontend, uploads zonder inhoudscontrole, openbare tokens in URL's
            en endpoints zonder rate limit. De CSP staat inline scripts alleen toe op hash in login/setup.html.
      - uses: anthropics/claude-code-security-review@main
        if: steps.scope.outputs.review == 'true' && steps.scope.outputs.model == ''
        with:
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          comment-pr: true
          exclude-directories: "beregeningsplanner/frontend/vendor,beregeningsplanner/backend/test/fixtures"
          custom-security-scan-instructions: |
            Dit is een multitenant webapp (Node/Express, SQLite en PostgreSQL met RLS). Let extra op: ontbrekend
            tenant_id-filter in queries, ontbrekende requireRight op routes, IDOR via id's uit de URL, SSRF bij
            uitgaande verbindingen (netguard.publicAddress), SQL die tekst plakt in plaats van ?-parameters,
            geheimen in logs, audit-detail of frontend, uploads zonder inhoudscontrole, openbare tokens in URL's
            en endpoints zonder rate limit. De CSP staat inline scripts alleen toe op hash in login/setup.html.
