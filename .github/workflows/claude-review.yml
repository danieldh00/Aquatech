name: Claude-review

# Eerste, verplichte controle op elke pull request naar master en develop: een code review en een securityreview door Claude.
# De jobnamen "Claude code review" en "Claude security review" zijn de required status checks in de ruleset.
# Draait op het Claude-abonnement: vereist het repository-secret CLAUDE_CODE_OAUTH_TOKEN (aan te maken met
# `claude setup-token`; zonder dat falen de jobs met een duidelijke melding, zodat een
# required check nooit stilletjes slaagt zonder review). Bevindingen komen als opmerkingen op de PR; de bouwthread
# lost ze op of antwoordt met een reden.
#
# Kosten zo laag mogelijk (elke run is betaald):
# - Elke PR krijgt een echte code- en securityreview (besluit Daniël 2026-11-19: code mag nooit gemerged worden zonder de
#   Claude code review); er is geen skip meer voor docs, tests of versie-bumps.
# - Model per soort run via repository-variabelen (staan bewust niet in de code): CLAUDE_REVIEW_MODEL voor de
#   eerste, volledige review (PR geopend of klaar voor review) en CLAUDE_REVIEW_MODEL_PUSH voor de lichtere review
#   van een volgende push. Leeg = standaardmodel van de action (duurder).
# - De review van een push beoordeelt alleen wat sinds de vorige review is gewijzigd; --max-turns begrenst de lus;
#   een nieuwe push annuleert een lopende run; concept-PR's worden overgeslagen.
# - Na een review moet er een opmerking van claude[bot] staan die in deze run is geplaatst; anders is de check rood
#   (geen oordeel = geen groene check).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [master, develop]

# Een nieuwe push vervangt de lopende review.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  code-review:
    name: Claude code review
    # Draait ook voor forks: een overgeslagen verplichte check telt als geslaagd, dus een fork-PR faalt hier expres.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Geen pull requests uit forks
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REPO" != "$REPO" ]; then
            echo "::error::Pull request uit een fork ($HEAD_REPO): handmatige review vereist. Forks krijgen geen secrets, dus geen Claude-review; zo'n PR kan niet automatisch slagen."
            exit 1
          fi
      - name: Controleer of de API-sleutel is ingesteld
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::Repository-secret CLAUDE_CODE_OAUTH_TOKEN ontbreekt (Settings > Secrets and variables > Actions; maak de token met `claude setup-token`). Zonder token is er geen Claude-review."
            exit 1
          fi
      - name: Wat is gewijzigd
        id: scope
        env:
          ACTION: ${{ github.event.action }}
          MODEL_FULL: ${{ vars.CLAUDE_REVIEW_MODEL }}
          MODEL_PUSH: ${{ vars.CLAUDE_REVIEW_MODEL_PUSH }}
        run: |
          # Altijd reviewen; alleen het model hangt af van de soort run.
          if [ "$ACTION" = "synchronize" ]; then
            model="$MODEL_PUSH"
          else
            model="$MODEL_FULL"
          fi
          echo "review=true" >> "$GITHUB_OUTPUT"
          echo "model=$model" >> "$GITHUB_OUTPUT"
          echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: steps.scope.outputs.review == 'true'
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1
        if: steps.scope.outputs.review == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: false
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            EVENT: ${{ github.event.action }}

            Doe een code review van deze pull request. Lees eerst CLAUDE.md in de root: daar staan de
            projectregels (checklist voor elke nieuwe feature, codestijl, harde regels). Controleer vooral:
            - juistheid en randgevallen (ook gelijktijdigheid), werkt de SQL in PostgreSQL, migratie in
              PG_MIGRATIONS;
            - tenant-isolatie, rechten (requireRight), rate limits, geheimen, invoer saneren, uploads;
            - queries: geen SELECT *, geen N+1, indexen met tenant_id vooraan, geen zware queries op een warme pad;
            - frontend: relatieve URL's, geen CDN's, --at-*-kleurvariabelen, getJson voor api/me en api/config;
            - tests: nieuwe routes hebben een test voor andere tenant (404) en ontbrekend recht (403);
            - een bestand changes/<naam>.md met de releasenotes als hub/ is gewijzigd (versienummer, CHANGELOG.md en
              releases.js worden na het mergen automatisch bijgewerkt en horen niet in de PR);
            - codestijl: duidelijke namen en een commentaarblok per functie in het Nederlands.
            De software is nog in ontwikkeling: meld geen problemen met gegevens van vóór een migratie.

            Is EVENT `synchronize`, dan is dit een volgende push op een PR die al is gereviewd: lees met
            `gh pr view --comments` je eerdere opmerkingen, beoordeel alleen de commits sinds die review
            (`gh pr view --json commits`) en herhaal niets wat al is gemeld.

            Gebruik `gh pr diff` en `gh pr view` om de wijzigingen te lezen en lees alleen de omliggende code die nodig is.
            Werk zuinig met beurten: begin met één `gh pr diff` en plaats al je inline opmerkingen in één keer.
            Plaats concrete bevindingen als inline opmerkingen op de regel (mcp__github_inline_comment__create_inline_comment,
            met confirmed: true) en eindig met één korte samenvattende opmerking (`gh pr comment`) met het oordeel.
            De laatste regel van die opmerking is exact `OORDEEL: akkoord` of `OORDEEL: blokkerend`. Gebruik
            `blokkerend` alleen bij een bevinding die vóór het mergen opgelost moet zijn (fout in gedrag, lek of
            gegevensverlies); kleinere punten en smaak zijn `akkoord`.
            Wees specifiek en geef per bevinding het gevolg en een voorstel voor de oplossing. Geen opmerkingen over
            smaak of dingen die goed zijn. Schrijf in het Nederlands.
          claude_args: >-
            ${{ steps.scope.outputs.model && format('--model {0}', steps.scope.outputs.model) || '' }}
            --max-turns 40
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"
      - name: Controleer dat er een oordeel is geplaatst
        if: steps.scope.outputs.review == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          STARTED: ${{ steps.scope.outputs.started }}
        run: |
          # Geen oordeel = rode check: de samenvattende opmerking van claude[bot] moet in deze run zijn geplaatst.
          # Geen oordeel = rode check; "OORDEEL: blokkerend" ook. Het oordeel staat in de laatste regel van een opmerking van claude[bot] uit deze run.
          verdict=$(gh api "repos/$REPO/issues/$NUMBER/comments" --paginate --jq '.[] | select(.user.login == "claude[bot]" and .created_at >= env.STARTED) | .body' | grep -E '^OORDEEL: (akkoord|blokkerend)[[:space:]]*$' | tail -n 1 | tr -d '[:space:]' || true)
          if [ -z "$verdict" ]; then
            echo "::error::De review heeft geen oordeel ('OORDEEL: akkoord' of 'OORDEEL: blokkerend') op de PR geplaatst sinds $STARTED. Een check zonder oordeel telt niet als geslaagd."
            exit 1
          fi
          if [ "$verdict" != "OORDEEL:akkoord" ]; then
            echo "::error::De review is blokkerend. Los de opmerkingen op of beantwoord ze met een reden; een nieuwe push start de review opnieuw."
            exit 1
          fi

  security-review:
    name: Claude security review
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Geen pull requests uit forks
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REPO" != "$REPO" ]; then
            echo "::error::Pull request uit een fork ($HEAD_REPO): handmatige review vereist. Forks krijgen geen secrets, dus geen Claude-review; zo'n PR kan niet automatisch slagen."
            exit 1
          fi
      - name: Controleer of de API-sleutel is ingesteld
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::Repository-secret CLAUDE_CODE_OAUTH_TOKEN ontbreekt (Settings > Secrets and variables > Actions; maak de token met `claude setup-token`). Zonder token is er geen securityreview."
            exit 1
          fi
      - name: Wat is gewijzigd
        id: scope
        env:
          ACTION: ${{ github.event.action }}
          MODEL_FULL: ${{ vars.CLAUDE_REVIEW_MODEL }}
          MODEL_PUSH: ${{ vars.CLAUDE_REVIEW_MODEL_PUSH }}
        run: |
          # Altijd reviewen; alleen het model hangt af van de soort run.
          if [ "$ACTION" = "synchronize" ]; then
            model="$MODEL_PUSH"
          else
            model="$MODEL_FULL"
          fi
          echo "review=true" >> "$GITHUB_OUTPUT"
          echo "model=$model" >> "$GITHUB_OUTPUT"
          echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: steps.scope.outputs.review == 'true'
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1
        if: steps.scope.outputs.review == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: false
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            EVENT: ${{ github.event.action }}

            Doe een securityreview van deze pull request, zoals het commando /security-review: zoek alleen
            kwetsbaarheden die deze wijziging introduceert en die realistisch uitbuitbaar zijn (injectie, autorisatie,
            geheimen, SSRF, onveilige uploads, XSS), met weinig valse positieven.
            Dit is een multitenant webapp (Node/Express, PostgreSQL met RLS). Let extra op: ontbrekend
            tenant_id-filter in queries, ontbrekende requireRight op routes, IDOR via id's uit de URL, SSRF bij
            uitgaande verbindingen (netguard.publicAddress), SQL die tekst plakt in plaats van ?-parameters,
            geheimen in logs, audit-detail of frontend, uploads zonder inhoudscontrole, openbare tokens in URL's
            en endpoints zonder rate limit. De CSP staat inline scripts alleen toe op hash in login/setup.html.
            Slaat de frontend vendor-map, afbeeldingen en hub/backend/test/fixtures over.

            Is EVENT `synchronize`, dan is dit een volgende push: lees met `gh pr view --comments` je eerdere
            opmerkingen, beoordeel alleen de commits sinds die review en herhaal niets wat al is gemeld.

            Gebruik `gh pr diff` en `gh pr view`. Plaats elke bevinding als inline opmerking op de regel
            (mcp__github_inline_comment__create_inline_comment, met confirmed: true) met ernst, aanvalsscenario en
            voorstel voor de oplossing, en eindig met één korte samenvattende opmerking (`gh pr comment`).
            Geen bevindingen: één regel dat er niets is gevonden. De laatste regel van die opmerking is exact
            `OORDEEL: akkoord` of `OORDEEL: blokkerend`; `blokkerend` bij elke bevinding die realistisch
            uitbuitbaar is en vóór het mergen opgelost moet zijn. Schrijf in het Nederlands.
          claude_args: >-
            ${{ steps.scope.outputs.model && format('--model {0}', steps.scope.outputs.model) || '' }}
            --max-turns 40
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"
      - name: Controleer dat er een oordeel is geplaatst
        if: steps.scope.outputs.review == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          STARTED: ${{ steps.scope.outputs.started }}
        run: |
          # Geen oordeel = rode check: de samenvattende opmerking van claude[bot] moet in deze run zijn geplaatst.
          # Geen oordeel = rode check; "OORDEEL: blokkerend" ook. Het oordeel staat in de laatste regel van een opmerking van claude[bot] uit deze run.
          verdict=$(gh api "repos/$REPO/issues/$NUMBER/comments" --paginate --jq '.[] | select(.user.login == "claude[bot]" and .created_at >= env.STARTED) | .body' | grep -E '^OORDEEL: (akkoord|blokkerend)[[:space:]]*$' | tail -n 1 | tr -d '[:space:]' || true)
          if [ -z "$verdict" ]; then
            echo "::error::De review heeft geen oordeel ('OORDEEL: akkoord' of 'OORDEEL: blokkerend') op de PR geplaatst sinds $STARTED. Een check zonder oordeel telt niet als geslaagd."
            exit 1
          fi
          if [ "$verdict" != "OORDEEL:akkoord" ]; then
            echo "::error::De review is blokkerend. Los de opmerkingen op of beantwoord ze met een reden; een nieuwe push start de review opnieuw."
            exit 1
          fi
