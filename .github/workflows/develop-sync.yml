name: Develop bijwerken

# Houdt `develop` gelijk met `master`: master wordt in develop gemerged, dagelijks, na elke release en op afroep.
# Zo loopt develop nooit achter op releases (versienummer, CHANGELOG, releases.js) en blijft het develop → master-PR
# per module klein. De merge wordt met RELEASE_PUSH_TOKEN naar develop gepusht (bypass in de ruleset van develop,
# net als bij release.yml). Een merge met conflicten wordt NIET geforceerd: de run faalt en er komt een issue met
# het label `develop-sync`; los het conflict op in een gewone branch en PR naar develop.
# Staging (apps01, deploy/staging/install-staging.sh) volgt develop en bouwt zichzelf via een timer (elke 15 minuten) opnieuw.

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [master]
  workflow_dispatch:

concurrency:
  group: develop-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: master naar develop
    # Na een mislukte release is er niets nieuws om te syncen.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false
      - name: master in develop mergen
        env:
          PUSH_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$PUSH_TOKEN" ]; then
            echo "::error::Secret RELEASE_PUSH_TOKEN ontbreekt; develop kan niet worden bijgewerkt."
            exit 1
          fi
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git_auth() { git -c "http.https://github.com/.extraheader=$auth_header" "$@"; }
          if ! git_auth ls-remote --exit-code --heads origin develop >/dev/null 2>&1; then
            echo "::notice::Er is nog geen develop-branch; niets te doen."
            exit 0
          fi
          for attempt in 1 2 3; do
            git_auth fetch origin master develop
            git checkout -q -B develop origin/develop
            if git merge-base --is-ancestor origin/master HEAD; then
              echo "develop bevat master al."
              exit 0
            fi
            if ! git merge --no-ff --no-edit -m "Merge master into develop" origin/master; then
              git merge --abort || true
              echo "::error::Merge-conflict tussen master en develop."
              if [ -z "$(gh issue list --repo "$GITHUB_REPOSITORY" --label develop-sync --state open --json number --jq '.[0].number')" ]; then
                gh label create develop-sync --repo "$GITHUB_REPOSITORY" --color B60205 --description "master naar develop sync mislukt" 2>/dev/null || true
                gh issue create --repo "$GITHUB_REPOSITORY" --label develop-sync \
                  --title "master naar develop: merge-conflict" \
                  --body "De automatische sync van master naar develop (workflow *Develop bijwerken*) geeft een conflict. Los het op in een branch vanaf develop (git merge origin/master) en merge die via een PR naar develop. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
              fi
              exit 1
            fi
            if git_auth push origin HEAD:develop; then
              echo "develop bijgewerkt met master."
              exit 0
            fi
            echo "Push mislukt (poging $attempt); opnieuw op de nieuwste develop."
            sleep $((attempt * 5))
          done
          exit 1
