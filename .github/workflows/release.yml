name: Release

# Bouwt bij elke nieuwe app-versie op master een image en zet die in GHCR:
#   ghcr.io/danieldh00/aquatech:<versie>  en  :latest
# Volgorde: versie en notes -> tests -> bouwen -> smoketest -> pushen.
# Versie en notes: PR's brengen alleen een bestand changes/<naam>.md mee; de eerste job geeft dat het
# volgende versienummer, werkt package.json, CHANGELOG.md en releases.js bij en commit dat naar master
# (met [skip ci], zodat er geen tweede run ontstaat). Zie changes/README.md. Faalt een stap, dan komt er
# geen nieuw image en rolt de server (deploy/apps01/update.sh) niets uit.

on:
  push:
    branches: [master]
    paths:
      - "hub/**"
      - "changes/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/danieldh00/aquatech

jobs:
  # Verwerkt de bestanden in changes/ tot een nieuwe versie op master. Geen bestanden = niets te doen.
  # Rechten: master is beschermd (PR verplicht, geen bypass). Zet daarom een token in het secret
  # RELEASE_PUSH_TOKEN van een beheerder met schrijfrechten op de repository, en zet de rol *Repository admin*
  # als bypass in de ruleset van master (Settings > Rules > Rulesets). Zonder dat secret valt deze job
  # terug op GITHUB_TOKEN, en de push wordt dan door de ruleset geweigerd.
  prepare:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      ref: ${{ steps.bump.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PUSH_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Versie en releasenotes bijwerken
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin master
            git reset --hard origin/master
            node hub/backend/tools/release-notes.js
            if git diff --quiet HEAD; then
              echo "Niets te bumpen."
              break
            fi
            version=$(jq -r .version hub/backend/package.json)
            git add -A changes hub/backend/package.json hub/CHANGELOG.md hub/frontend/nieuws/releases.js
            git commit -m "Release $version [skip ci]"
            if git push origin HEAD:master; then
              break
            fi
            echo "Push mislukt (poging $attempt); opnieuw op de nieuwste master."
            [ "$attempt" = 5 ] && exit 1
            sleep $((attempt * 5))
          done
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Productie draait op Supabase: dezelfde tests ook tegen PostgreSQL.
  test:
    needs: prepare
    runs-on: ubuntu-latest
    # Twee testruns (SQLite + PostgreSQL) duren samen ~14 min; 15 was te krap en
    # annuleerde de release (1.9.6, 1.10.0) zonder image.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: hub/backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: hub/backend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      - run: npm audit --omit=dev --audit-level=high

  publish:
    needs: [prepare, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Versie bepalen
        id: version
        run: |
          v=$(jq -r .version hub/backend/package.json)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Versie: $v"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bestaat deze versie al?
        id: exists
        run: |
          if docker manifest inspect "$IMAGE:${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Image $IMAGE:${{ steps.version.outputs.version }} bestaat al; niets te doen."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.exists.outputs.skip == 'false'

      - name: Bouwen (lokaal laden voor de smoketest)
        if: steps.exists.outputs.skip == 'false'
        uses: docker/build-push-action@v6
        with:
          context: hub
          platforms: linux/amd64
          load: true
          tags: aquatech:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoketest
        if: steps.exists.outputs.skip == 'false'
        run: |
          docker run -d --name smoke -p 3300:3300 aquatech:smoke
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3300/api/health && exit 0; sleep 2; done
          docker logs smoke
          exit 1

      # Pas na een geslaagde smoketest naar GHCR: :latest wijst nooit naar een kapot image.
      - name: Pushen naar GHCR
        if: steps.exists.outputs.skip == 'false'
        uses: docker/build-push-action@v6
        with:
          context: hub
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha
