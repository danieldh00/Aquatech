name: Staging

# Bouwt vanaf `develop` het stagingimage en zet dat in GHCR:
#   ghcr.io/danieldh00/aquatech-staging:develop-<commit>  en  :latest
# Staging is een aparte omgeving (VM stg01, eigen database, geen koppelingen; zie deploy/staging/README.md). De tests
# draaien al in CI op de PR naar develop; hier alleen bouwen, een smoketest en pushen. Het stagingimage heeft een
# andere naam dan het productie-image: `deploy/apps01/update.sh` pakt alleen `aquatech:latest` (met cosign-controle
# op release.yml van master) en kan dit image dus nooit installeren. Niet ondertekend: staging rolt zelf alleen
# `aquatech-staging` uit (deploy/staging/update-staging.sh).

on:
  push:
    branches: [develop]
    paths:
      - "hub/**"
      - "changes/**"
      - ".github/workflows/staging.yml"
  workflow_dispatch:

concurrency:
  group: staging
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/danieldh00/aquatech-staging

jobs:
  publish:
    name: Staging-image bouwen
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: develop
      - name: Tag bepalen
        id: tag
        run: |
          echo "commit=develop-$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r .version hub/backend/package.json)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Bouwen (lokaal laden voor de smoketest)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: hub
          platforms: linux/amd64
          load: true
          tags: aquatech-staging:smoke
          cache-from: type=gha,scope=staging
          cache-to: type=gha,mode=max,scope=staging
      - name: Smoketest
        run: |
          docker network create smokenet
          docker run -d --name smokedb --network smokenet -e POSTGRES_PASSWORD=smoke postgres:17
          for i in $(seq 1 30); do docker exec smokedb pg_isready -U postgres && break; sleep 2; done
          docker run -d --name smoke --network smokenet -p 3300:3300 -e DATABASE_URL="postgres://postgres:smoke@smokedb:5432/postgres?sslmode=disable" aquatech-staging:smoke
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3300/api/health && exit 0; sleep 2; done
          docker logs smoke
          exit 1
      - name: Pushen naar GHCR
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: hub
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.commit }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tag.outputs.version }}
          cache-from: type=gha,scope=staging
