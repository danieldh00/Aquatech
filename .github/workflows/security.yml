name: Security scans

# Vindt lekken en kwetsbaarheden vóór productie: geheimen in de code (gitleaks) en een scan van het gebouwde
# image (Trivy). Codeanalyse doet de Claude security review (claude-review.yml); CodeQL is bewust niet meer in gebruik. Draait bij code-wijzigingen in een PR, op master en wekelijks (nieuwe CVE's in bestaande code).
# Secret scanning en push protection van GitHub zelf staan in de repo-instellingen (Settings > Code security), niet hier.
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Bepaalt of de PR code raakt (zelfde regel als ci.yml); een overgeslagen job telt als geslaagd.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - name: Raakt deze wijziging code?
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$NUMBER" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api "repos/$REPO/pulls/$NUMBER/files" --paginate --jq '.[].filename') || { echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; }
          if echo "$files" | grep -Eq '^(hub/|deploy/|docker-compose\.yml|\.github/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Geen code gewijzigd: beveiligingsscans overgeslagen."
          fi

  # Zoekt geheimen (sleutels, tokens, wachtwoorden) in de hele git-historie.
  secrets:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2
          detect --source /repo --config /repo/.gitleaks.toml --redact --verbose --exit-code 1

  # Bouwt het image (amd64) en scant het op bekende kwetsbaarheden met een beschikbare oplossing.
  container:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - name: Image bouwen
        run: docker build -t hub:scan hub
      # Op een PR en op master alleen rapporteren (een bestaande kwetsbaarheid in het basisimage mag een PR niet blokkeren);
      # de wekelijkse run faalt wel, zodat een openstaande kwetsbaarheid opvalt. Alles staat ook onder Security > Code scanning.
      - name: Trivy-scan (hoog en kritiek, alleen met oplossing)
        env:
          EXIT_CODE: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out" aquasec/trivy:0.57.1
          image --format sarif --output /out/trivy.sarif --severity CRITICAL,HIGH --ignore-unfixed --exit-code "$EXIT_CODE" hub:scan
      - name: Trivy-samenvatting
        if: always()
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.57.1
          image --format table --severity CRITICAL,HIGH --ignore-unfixed --exit-code 0 hub:scan
      - name: Resultaat naar GitHub-beveiliging
        if: always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: trivy-container
